<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hive orange hexagon background -->
  <polygon points="256,24 468,140 468,372 256,488 44,372 44,140" fill="#FF6900"/>

  <!-- Subtle inner hexagon for depth -->
  <polygon points="256,60 440,163 440,349 256,452 72,349 72,163" fill="#FF7B20" opacity="0.4"/>

  <!-- Calendar white body -->
  <rect x="152" y="190" width="208" height="178" rx="14" ry="14" fill="white"/>

  <!-- Calendar header bar (orange) -->
  <rect x="152" y="190" width="208" height="52" rx="14" ry="14" fill="#CC5500"/>
  <!-- Square off the bottom corners of the header -->
  <rect x="152" y="228" width="208" height="14" fill="#CC5500"/>

  <!-- Calendar binding rings -->
  <rect x="204" y="168" width="18" height="44" rx="9" ry="9" fill="white"/>
  <rect x="290" y="168" width="18" height="44" rx="9" ry="9" fill="white"/>

  <!-- Calendar header text lines (decorative) -->
  <rect x="192" y="206" width="128" height="10" rx="5" ry="5" fill="white" opacity="0.9"/>
  <rect x="212" y="222" width="88" height="8" rx="4" ry="4" fill="white" opacity="0.5"/>

  <!-- Calendar grid: row 1 -->
  <circle cx="208" cy="284" r="11" fill="#FF6900"/>
  <circle cx="256" cy="284" r="11" fill="#FF6900"/>
  <circle cx="304" cy="284" r="11" fill="#FF6900"/>

  <!-- Calendar grid: row 2 -->
  <circle cx="208" cy="324" r="11" fill="#FF6900"/>
  <circle cx="256" cy="324" r="11" fill="#FF6900"/>
  <!-- Highlighted today cell -->
  <circle cx="304" cy="324" r="14" fill="#CC5500"/>
  <circle cx="304" cy="324" r="9" fill="white"/>
</svg>
